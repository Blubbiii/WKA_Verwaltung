# =============================================================================
# WindparkManager - CI Pipeline
# Continuous Integration: Lint, Type-Check, Build, Tests
# =============================================================================
#
# Diese Pipeline laeuft bei jedem Push auf main und bei Pull Requests.
# Sie stellt sicher, dass der Code fehlerfrei ist, bevor er gemerged wird.
#
# Jobs:
#   1. lint        - ESLint Pruefung + TypeScript Type-Check
#   2. build       - Next.js Production Build (mit Prisma Client)
#   3. test        - Tests ausfuehren (optional, laeuft nur wenn Tests existieren)
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Verhindert doppelte Runs: Wenn ein neuer Push kommt, wird der alte Run abgebrochen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Gemeinsame Environment Variables fuer alle Jobs
env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ===========================================================================
  # Job 1: Lint & Type-Check
  # Prueft Code-Qualitaet mit ESLint und TypeScript Compiler
  # ===========================================================================
  lint:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Schritt 1: Repository auschecken
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Schritt 2: Node.js einrichten mit npm-Cache fuer schnellere Builds
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # Schritt 3: Dependencies installieren (npm ci = saubere Installation aus lockfile)
      - name: Install Dependencies
        run: npm ci

      # Schritt 4: Prisma Client generieren (wird von einigen Imports benoetigt)
      # Prisma 7: kein url in schema.prisma — generate braucht keine DATABASE_URL
      - name: Generate Prisma Client
        run: npx prisma generate

      # Schritt 5: ESLint ausfuehren
      # Nutzt "next lint" aus package.json, das die eslint.config.mjs konfiguration verwendet.
      # --max-warnings 0 stellt sicher, dass auch Warnungen den Build fehlschlagen lassen.
      # HINWEIS: Aktuell sind viele Regeln als "warn" konfiguriert (eslint.config.mjs).
      # Wenn zu viele Warnungen existieren, temporaer --max-warnings erhoehen.
      - name: Run ESLint
        run: npm run lint

      # Schritt 6: TypeScript Type-Check (ohne Output zu generieren)
      # Prueft ob alle Typen korrekt sind, ohne tatsaechlich zu kompilieren
      - name: TypeScript Type-Check
        run: npx tsc --noEmit

  # ===========================================================================
  # Job 2: Build
  # Erstellt einen vollstaendigen Next.js Production Build
  # Haengt von "lint" ab - Build startet nur wenn Lint erfolgreich war
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Schritt: .env Datei mit Dummy-Werten erstellen
      # Der Build braucht bestimmte Environment Variables, auch wenn sie nur Platzhalter sind.
      # Prisma braucht DATABASE_URL, NextAuth braucht NEXTAUTH_SECRET und NEXTAUTH_URL.
      # Sentry-Variablen werden bewusst NICHT gesetzt, damit kein Source-Map-Upload stattfindet.
      - name: Create .env for Build
        run: |
          cat << 'EOF' > .env
          DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
          NEXTAUTH_SECRET=ci-test-secret-key-minimum-32-characters-long
          NEXTAUTH_URL=http://localhost:3000
          REDIS_URL=redis://localhost:6379
          S3_ENDPOINT=http://localhost:9000
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=minioadmin
          S3_BUCKET=wpm-documents
          S3_REGION=us-east-1
          EOF

      # Schritt: Prisma Client generieren (benoetigt fuer den Build)
      - name: Generate Prisma Client
        run: npx prisma generate

      # Schritt: Next.js Production Build ausfuehren
      # Setzt NEXT_TELEMETRY_DISABLED um keine Telemetrie an Vercel zu senden
      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Schritt: Build-Artefakte als Artifact hochladen (fuer spaetere Jobs oder Debugging)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nextjs-build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 3

  # ===========================================================================
  # Job 3: Tests (optional)
  # Fuehrt Tests aus, sofern vorhanden. Blockiert die Pipeline NICHT wenn
  # keine Tests existieren oder Tests fehlschlagen (continue-on-error).
  #
  # Sobald Tests geschrieben werden, sollte continue-on-error entfernt werden!
  # ===========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    # Tests muessen bestehen - Pipeline schlaegt fehl bei Test-Fehlern
    continue-on-error: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Pruefe ob Test-Dateien vorhanden sind, bevor Tests gestartet werden.
      # Vermeidet unnoetige Fehlermeldungen wenn noch keine Tests geschrieben wurden.
      - name: Check for Test Files
        id: check-tests
        run: |
          # Suche nach Test-Dateien im src/ Verzeichnis (ignoriere node_modules)
          TEST_FILES=$(find src -name "*.test.ts" -o -name "*.test.tsx" -o -name "*.spec.ts" -o -name "*.spec.tsx" 2>/dev/null | head -5)
          if [ -n "$TEST_FILES" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Gefundene Test-Dateien:"
            echo "$TEST_FILES"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "Keine Test-Dateien gefunden in src/. Tests werden uebersprungen."
          fi

      # Tests nur ausfuehren wenn Test-Dateien gefunden wurden
      # Nutzt vitest (oder jest) - muss ggf. angepasst werden wenn Test-Framework gewaehlt wird
      - name: Run Tests
        if: steps.check-tests.outputs.found == 'true'
        run: |
          # Pruefe ob ein test-Script in package.json existiert
          if npm run test --if-present 2>/dev/null; then
            echo "Tests erfolgreich!"
          else
            echo "Test-Script fehlgeschlagen. Pruefe die Konfiguration."
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          NEXTAUTH_SECRET: ci-test-secret-key-minimum-32-characters-long
          NEXTAUTH_URL: http://localhost:3000

      - name: No Tests Found
        if: steps.check-tests.outputs.found == 'false'
        run: |
          echo "========================================="
          echo "HINWEIS: Keine Tests vorhanden."
          echo "Empfehlung: Vitest einrichten und Tests schreiben!"
          echo ""
          echo "  npm install -D vitest @vitejs/plugin-react"
          echo "  # Dann Test-Dateien in src/ erstellen"
          echo "========================================="

  # ===========================================================================
  # Job 4: Ablauf-Tests (Playwright)
  #
  # Warum dieser Job existiert: die E2E-Suite lief zuletzt am 13.04.2026 und
  # danach vier Monate nicht mehr. Eine Suite, die niemand startet, verfaellt —
  # und ihr Gruen vom letzten Lauf suggeriert eine Sicherheit, die es nicht
  # gibt. Deshalb laeuft sie ab jetzt bei jedem Push.
  #
  # Bewusst NUR e2e/journeys: das sind die Tests mit strengen Zusicherungen,
  # die etwas anlegen und wieder loeschen. Die aelteren Spezifikationen eine
  # Ebene hoeher sind ein Rauchtest mit 162 verschluckten Fehlern — sie
  # gehoeren erst dazu, wenn sie ueberarbeitet sind (siehe
  # e2e/journeys/README.md).
  # ===========================================================================
  e2e:
    name: Ablauf-Tests (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wpm
          POSTGRES_PASSWORD: wpm
          POSTGRES_DB: windparkmanager_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Die Suite erzeugt mehr Last als jeder Mensch und reisst sonst die
      # Vorgabe von 100 Anfragen je Minute. Abgewiesen wuerden dann die
      # Anfragen der ANWENDUNG (Auswahllisten der Assistenten) — eine leere
      # Liste sieht aus wie ein Fehler im Programm. Die Vorgabe im Quelltext
      # bleibt unveraendert; der Server meldet die Abweichung beim Start.
      API_RATE_LIMIT: "2000"
      DATABASE_URL: postgresql://wpm:wpm@localhost:5432/windparkmanager_e2e?schema=public
      NEXTAUTH_SECRET: ci-e2e-secret-key-minimum-32-characters-long
      AUTH_SECRET: ci-e2e-secret-key-minimum-32-characters-long
      NEXTAUTH_URL: http://localhost:3050
      NEXT_PUBLIC_APP_URL: http://localhost:3050
      REDIS_URL: redis://localhost:6379
      # Der Seed legt admin@windparkmanager.de an; die Suite meldet sich damit
      # an. Das Passwort steht hier ausdruecklich, damit niemand es fuer ein
      # Versehen haelt — es gilt nur fuer diese Wegwerf-Datenbank.
      SEED_SUPERADMIN_PASSWORD: ci-e2e-passwort
      E2E_EMAIL: admin@windparkmanager.de
      E2E_PASSWORD: ci-e2e-passwort
      # Alle Arbeiter eines Laufs teilen sich diese Kennung. Ohne sie erzeugt
      # jeder Prozess eine eigene, und das Aufraeumen findet die Spuren der
      # anderen nicht.
      E2E_RUN_ID: ci-${{ github.run_id }}
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: wpm-documents
      S3_REGION: us-east-1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # db push statt migrate deploy — dieselbe Reihenfolge wie im Container.
      # Ein Schema, das hier nicht durchgeht, geht auch beim Deployment nicht
      # durch, und das faellt lieber jetzt auf.
      # Zwei Prisma-7-Eigenheiten, an denen je ein CI-Lauf gescheitert ist:
      #
      # 1. `--skip-generate` gibt es nicht mehr.
      # 2. `db push` liest die Datenbank-Adresse NICHT mehr aus der Umgebung.
      #    In schema.prisma steht bewusst kein `url` — die CLI erwartet sie
      #    daher aus einer Prisma-Config-Datei, die es hier nicht gibt, und
      #    bricht ab mit „datasource.url property is required". `--url` gibt
      #    sie direkt mit. Kein Config-File anlegen: das wuerde auch lokal
      #    und im Container gelten und dort etwas aendern, das laeuft.
      #
      # `--accept-data-loss` wie im Container-Entrypoint — die Datenbank ist
      # hier ohnehin frisch.
      - name: Schema anlegen
        run: npx prisma db push --accept-data-loss --url "$DATABASE_URL"

      - name: Seed-Daten laden
        run: npm run db:seed

      # Nur Chromium: drei Browser verdreifachen die Laufzeit, ohne dass ein
      # Ablauf-Test dadurch etwas anderes faende. Browser-Unterschiede sind
      # Sache der Sichtpruefungen, nicht der Ablaeufe.
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Anwendung bauen
        run: npm run build

      # Warten ohne Zusatzpaket: eine Schleife auf den Liveness-Endpunkt.
      # `wait-on` waere eine Abhaengigkeit mehr fuer etwas, das drei Zeilen
      # Shell sind — und sie scheitert lauter, wenn der Start haengt.
      - name: Anwendung starten
        run: |
          npm start -- -p 3050 > /tmp/wpm-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3050/api/health/live > /dev/null; then
              echo "Anwendung laeuft nach ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Die Anwendung war nach 60s nicht erreichbar. Serverprotokoll:"
          cat /tmp/wpm-server.log
          exit 1

      - name: Ablauf-Tests
        run: npx playwright test e2e/journeys --project=chromium --reporter=list

      # Bei einem Fehlschlag sind Spur, Bildschirmfoto und Video das, womit
      # sich die Ursache ohne lokales Nachstellen finden laesst.
      - name: Bericht sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: |
            playwright-report/
            test-results/
          retention-days: 14
